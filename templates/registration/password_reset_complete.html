{% extends "base.html" %}

{% block content %}
<section class="auth-shell">
    <div class="row justify-content-center w-100">
        <div class="col-md-8 col-lg-6">
            <div class="card auth-card border-0 scale-in">
                <div class="card-body text-center">
                    <div class="d-inline-flex align-items-center justify-content-center mb-3" style="width: 3.5rem; height: 3.5rem; border-radius: var(--aq-radius-lg); background: var(--aq-accent-light);">
                        <i class="bi bi-check-circle" style="font-size: 1.5rem; color: var(--aq-accent);"></i>
                    </div>
                    <h1 class="auth-title h3 mb-2">Password Updated</h1>
                    <p class="auth-subtitle mb-4">Your password has been reset successfully.</p>
                    <a href="{% url 'login' %}" class="btn btn-primary px-4 py-2">
                        <i class="bi bi-box-arrow-in-right me-1"></i>Sign In Now
                    </a>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
