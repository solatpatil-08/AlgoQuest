{% extends "base.html" %}

{% block content %}
<section class="auth-shell">
    <div class="row justify-content-center w-100">
        <div class="col-md-8 col-lg-6">
            <div class="card auth-card border-0 scale-in">
                <div class="card-body text-center">
                    <div class="d-inline-flex align-items-center justify-content-center mb-3" style="width: 3.5rem; height: 3.5rem; border-radius: var(--aq-radius-lg); background: var(--aq-accent-light);">
                        <i class="bi bi-envelope-check" style="font-size: 1.5rem; color: var(--aq-accent);"></i>
                    </div>
                    <h1 class="auth-title h3 mb-2">Check Your Email</h1>
                    <p class="auth-subtitle mb-3">
                        If an account exists for that email, a reset link has been sent.
                    </p>
                    <p class="mb-4 text-muted">Please check your inbox and spam folder.</p>
                    <a href="{% url 'login' %}" class="btn btn-outline-primary px-4">
                        <i class="bi bi-arrow-left me-1"></i>Return to Sign In
                    </a>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
