databases:
  - name: algoquest-db
    plan: free
    databaseName: algoquest
    user: algoquest

services:
  - type: web
    name: algoquest-web
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: daphne -b 0.0.0.0 -p $PORT AlgoQuest.asgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: algoquest-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "True"
      - key: DJANGO_SECURE_HSTS_SECONDS
        value: "31536000"
      - key: DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: "True"
      - key: DJANGO_SECURE_HSTS_PRELOAD
        value: "True"
